<!DOCTYPE html>

<html>

<head>

    <title>Movie Explorer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->

    <header>

        <h1>Movie Explorer</h1>

        <nav>

            <a href="#">Home</a>

            <a href="#">Movies</a>

            <a href="#">Trending</a>

            <a href="#">Watchlist</a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>


        <!-- Search Section -->

        <section>

            <h2>Find Your Next Movie</h2>

            <p>
                Search movies and find where you can watch them.
            </p>


            <div class="search-box">

                <input
                    type="text"
                    id="movieInput"
                    placeholder="Enter movie name"
                >

                <button id="searchButton">
                    Search
                </button>

            </div>

        </section>


        <!-- Movie Section -->

        <section>

            <h2>Movies</h2>


            <div id="movieContainer">


                <!-- Movie Card -->

                <div class="movie-card">

                    <img
                        src="https://via.placeholder.com/200x300"
                        alt="Movie Poster"
                    >

                    <h3>Movie Name</h3>

                    <p>⭐ 8.5</p>

                    <p>2026</p>

                    <button>
                        View Details
                    </button>

                </div>


            </div>

        </section>


        <!-- OTT Section -->

        <section>

            <h2>Where To Watch</h2>

            <p>Select a movie to see its OTT availability.</p>

            <button>
                Netflix
            </button>

            <button>
                Prime Video
            </button>

            <button>
                JioHotstar
            </button>

        </section>


    </main>


    <!-- Footer -->

    <footer>

        <p>Movie Explorer © 2026</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
